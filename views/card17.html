<!doctype html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>密表 — 角色卡試看</title>
    <link rel="stylesheet" href="/css/card-studio-nav.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f5f4; color: #18181b; font: 12px/1.3 ui-sans-serif, "Segoe UI", "PingFang TC", sans-serif; }
        .sheet { width: min(840px, calc(100% - 12px)); margin: 8px auto 16px; background: #fff; border: 1px solid #e4e4e7; }
        .top { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #e4e4e7; }
        img { width: 36px; height: 36px; object-fit: cover; }
        h1 { margin: 0; font-size: 15px; font-weight: 650; }
        .top p { margin: 0; color: #71717a; }
        .grid { display: grid; grid-template-columns: 1.1fr 1fr 1.3fr; }
        section { padding: 6px 8px 8px; }
        section + section { border-left: 1px solid #e4e4e7; }
        h2 { margin: 0 0 4px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #71717a; }
        .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 0; }
        .row span { font-variant-numeric: tabular-nums; color: #3f3f46; }
        @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } section + section { border-left: 0; border-top: 1px solid #e4e4e7; } }
    </style>
</head>
<body>
    <nav class="studio-nav" data-studio-nav></nav>
    <article class="sheet">
        <header class="top">
            <img data-studio="image" alt="">
            <div><h1 data-studio="name"></h1><p><span data-studio="role"></span> · <span data-studio="trait"></span></p></div>
        </header>
        <div class="grid">
            <section><h2>數值</h2><div data-studio-list="stats"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div></section>
            <section><h2>動作</h2><div data-studio-list="rolls"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div></section>
            <section><h2>筆記</h2><div data-studio-list="notes"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div></section>
        </div>
    </article>
    <script src="/common/card-studio.js"></script>
</body>
</html>
