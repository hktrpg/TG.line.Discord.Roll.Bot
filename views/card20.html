<!doctype html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>三欄 — 角色卡試看</title>
    <link rel="stylesheet" href="/css/card-studio-nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #efe8dc; color: #221c16; font: 12px/1.35 "Newsreader", "PMingLiU", serif; }
        .paper { width: min(780px, calc(100% - 12px)); margin: 8px auto 16px; background: #f7f3ea; padding: 8px 12px 12px; border-top: 3px solid #221c16; border-bottom: 3px solid #221c16; }
        .mast { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #221c16; margin-bottom: 8px; }
        h1 { margin: 0; font-size: 26px; font-weight: 500; line-height: 1; }
        .mast p { margin: 0 0 2px; font-size: 12px; }
        img { width: 42px; height: 52px; object-fit: cover; }
        .cols { column-count: 3; column-gap: 16px; }
        h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.16em; break-after: avoid; }
        .row { display: flex; justify-content: space-between; gap: 6px; break-inside: avoid; border-bottom: 1px solid rgba(34,28,22,0.15); padding: 1px 0; }
        @media (max-width: 640px) { .cols { column-count: 1; } }
    </style>
</head>
<body>
    <nav class="studio-nav" data-studio-nav></nav>
    <article class="paper">
        <header class="mast">
            <div><h1 data-studio="name"></h1><p data-studio="role"></p></div>
            <img data-studio="image" alt="">
        </header>
        <div class="cols">
            <h2>數值</h2>
            <div data-studio-list="stats"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div>
            <h2>動作</h2>
            <div data-studio-list="rolls"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div>
            <h2>筆記</h2>
            <div data-studio-list="notes"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div>
        </div>
    </article>
    <script src="/common/card-studio.js"></script>
</body>
</html>
