<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <script src="/common/www-locale-head.js"></script>
    <script src="/common/www-theme-head.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-www-i18n="trpg_edit_page_title">編輯作品</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/trpg-hub.css">
    <script src="https://code.iconify.design/1/1.0.7/iconify.min.js"></script>
    <script src="/common/www-i18n.js"></script>
    <script src="/common/www-theme.js"></script>
    <script src="/common/site-chrome.js"></script>
    <script src="/common/trpg-hub-page.js"></script>
</head>
<body class="trpg-hub-body">
    <div id="header"></div>

    <div class="trpg-console">
        <header class="trpg-console-hero">
            <div>
                <p class="trpg-hub-kicker" data-www-i18n="trpg_edit_kicker">EDIT WORK</p>
                <h1 id="editPageTitle" data-www-i18n="trpg_edit_page_title">編輯作品</h1>
                <p class="trpg-console-lead" id="editPageLead"></p>
            </div>
            <div class="trpg-console-hero-actions">
                <a class="trpg-btn-sm" id="editBackLink" href="/logs" data-www-i18n="trpg_view_back">團錄列表</a>
            </div>
        </header>

        <div class="trpg-console-layout">
            <nav class="trpg-console-nav" id="editNav" aria-label="Edit tabs">
                <button type="button" class="trpg-console-nav-item active" data-edit-tab="basic" aria-current="page">
                    <span class="iconify" data-icon="mdi:text-box-outline" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_basic">基本</span>
                </button>
                <button type="button" class="trpg-console-nav-item" data-edit-tab="rating">
                    <span class="iconify" data-icon="mdi:shield-alert-outline" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_rating">分級</span>
                </button>
                <button type="button" class="trpg-console-nav-item" data-edit-tab="cover">
                    <span class="iconify" data-icon="mdi:image-outline" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_cover">封面</span>
                </button>
                <button type="button" class="trpg-console-nav-item" data-edit-tab="chapters">
                    <span class="iconify" data-icon="mdi:book-open-variant" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_chapters">章節</span>
                </button>
                <button type="button" class="trpg-console-nav-item" data-edit-tab="publish">
                    <span class="iconify" data-icon="mdi:publish" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_publish">發布</span>
                </button>
                <button type="button" class="trpg-console-nav-item" data-edit-tab="danger">
                    <span class="iconify" data-icon="mdi:alert-outline" data-width="18"></span>
                    <span data-www-i18n="trpg_edit_tab_danger">危險</span>
                </button>
            </nav>
            <main id="editPanel" class="trpg-console-main" aria-live="polite">
                <p class="trpg-msg-muted" data-www-i18n="trpg_view_loading">載入中…</p>
            </main>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="/common/session-log-api.js"></script>
    <script src="/common/session-log-edit-page.js"></script>
    <script>
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const logId = pathParts[1] || '';

        document.addEventListener('DOMContentLoaded', async function () {
            await initTrpgHubPage({ titleKey: 'trpg_edit_page_title' });
            await initSessionLogEditPage(logId);
        });
    </script>
</body>
</html>
