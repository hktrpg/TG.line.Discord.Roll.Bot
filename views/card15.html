<!doctype html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>夜表 — 角色卡試看</title>
    <link rel="stylesheet" href="/css/card-studio-nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@560&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #1a1a1a; color: #ddd4c8; font: 13px/1.3 "Source Sans 3", "PingFang TC", sans-serif; }
        .panel { width: min(920px, calc(100% - 12px)); margin: 8px auto 16px; background: #242424; border: 1px solid #3a3a3a; padding: 8px 10px 10px; }
        .head { display: grid; grid-template-columns: 1fr 88px; gap: 10px; align-items: start; }
        h1 { margin: 0; font-family: "Noto Serif TC", serif; font-size: 18px; color: #c9b59a; }
        .meta { margin: 2px 0 6px; color: #9a8f84; font-size: 12px; }
        img { width: 88px; height: 108px; object-fit: cover; border: 1px solid #cfc6b8; }
        .band { display: flex; flex-wrap: wrap; gap: 10px 14px; }
        .band div { min-width: 52px; }
        .band b { display: block; color: #b45555; font-size: 11px; font-weight: 600; }
        .band span { font-variant-numeric: tabular-nums; }
        .sec { margin-top: 8px; background: #3a3a3a; text-align: center; font-size: 13px; letter-spacing: 0.2em; padding: 3px 0; }
        .skills { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 2px 0; }
        .skills span { white-space: nowrap; }
        .skills b { font-weight: 400; margin-right: 6px; }
        .skills em { font-style: normal; color: #d07070; }
        .note { margin: 4px 0 0; font-size: 12px; color: #c8bfb2; }
    </style>
</head>
<body>
    <nav class="studio-nav" data-studio-nav></nav>
    <article class="panel">
        <header class="head">
            <div>
                <h1 data-studio="name"></h1>
                <p class="meta"><span data-studio="role"></span> · <span data-studio="trait"></span></p>
                <div class="band" data-studio-list="stats">
                    <template><div><b data-field="name"></b><span data-field="value"></span></div></template>
                </div>
            </div>
            <img data-studio="image" alt="">
        </header>
        <div class="sec">技能</div>
        <div class="skills" data-studio-list="rolls">
            <template><span><b data-field="name"></b><em data-field="value"></em></span></template>
        </div>
        <div class="sec">筆記</div>
        <div data-studio-list="notes">
            <template><p class="note"><b data-field="name"></b>　<span data-field="value"></span></p></template>
        </div>
    </article>
    <script src="/common/card-studio.js"></script>
</body>
</html>
