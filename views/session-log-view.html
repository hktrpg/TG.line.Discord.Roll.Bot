<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <script src="/common/www-locale-head.js"></script>
    <script src="/common/www-theme-head.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-www-i18n="trpg_view_page_title">團錄閱讀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/trpg-hub.css">
    <link rel="stylesheet" href="css/session-log.css">
    <script src="https://code.iconify.design/1/1.0.7/iconify.min.js"></script>
    <script src="/common/www-i18n.js"></script>
    <script src="/common/www-theme.js"></script>
    <script src="/common/site-chrome.js"></script>
    <script src="/common/trpg-hub-page.js"></script>
</head>
<body class="trpg-hub-body session-log-view-body">
    <div id="header"></div>
    <div class="session-log-shell">
        <aside class="session-log-aside">
            <div class="session-log-brand">
                <h1>SESSION LOG</h1>
                <a href="/logs" class="session-log-back" data-www-i18n="trpg_view_back">← 團錄列表</a>
                <button type="button" class="trpg-theme-btn session-log-theme-btn" data-www-theme-toggle>
                    <span class="iconify" data-icon="bi:moon-stars" data-width="16"></span>
                    <span data-www-theme-label data-www-i18n="roll_dark_mode">深色模式</span>
                </button>
            </div>
            <p class="session-log-nav-label" data-www-i18n="trpg_view_theme_nav">閱讀主題</p>
            <nav id="themeNav" class="session-log-theme-nav" aria-labelledby="themeNavLabel"></nav>
        </aside>
        <div class="session-log-stage">
            <div class="session-log-meta">
                <h2 id="logTitle" data-www-i18n="trpg_view_loading">載入中…</h2>
                <p id="logMeta"></p>
            </div>
            <div id="sessionLogPreview"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="/common/session-log-api.js"></script>
    <script src="/common/session-log-reader.js"></script>
    <script>
        const logId = window.location.pathname.split('/').filter(Boolean).pop();
        const shareToken = new URLSearchParams(window.location.search).get('token') || '';
        let currentLog = null;
        let currentTheme = 'kakuyomu';

        function t(key, options) {
            return typeof wwwT === 'function' ? wwwT(key, options) : key;
        }

        function buildThemeNav() {
            const nav = document.getElementById('themeNav');
            nav.innerHTML = '';
            SessionLogReader.THEMES.forEach((theme) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = SessionLogReader.themeLabel(theme.id);
                btn.dataset.id = theme.id;
                btn.classList.toggle('active', theme.id === currentTheme);
                btn.addEventListener('click', () => {
                    currentTheme = theme.id;
                    nav.querySelectorAll('button').forEach((el) => {
                        el.classList.toggle('active', el.dataset.id === currentTheme);
                    });
                    renderPreview();
                });
                nav.append(btn);
            });
        }

        function renderPreview() {
            if (!currentLog) return;
            const { html } = SessionLogReader.render(currentLog, currentTheme);
            document.getElementById('sessionLogPreview').innerHTML = html;
        }

        async function loadLog() {
            try {
                currentLog = await SessionLogApi.getLog(logId, shareToken);
                currentTheme = currentLog.theme || 'kakuyomu';
                document.getElementById('logTitle').textContent = currentLog.title;
                document.getElementById('logMeta').textContent = [
                    currentLog.sessionDate,
                    currentLog.location,
                    t('trpg_view_events', { count: (currentLog.events || []).length }),
                ].filter(Boolean).join(' · ');
                document.title = `${currentLog.title} · HKTRPG`;
                buildThemeNav();
                renderPreview();
            } catch (error) {
                document.getElementById('logTitle').textContent = error.status === 403
                    ? t('trpg_view_forbidden')
                    : t('trpg_view_not_found');
                document.getElementById('logMeta').textContent = '';
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await initTrpgHubPage({ titleKey: 'trpg_view_page_title' });
            loadLog();
        });
    </script>
</body>
</html>
