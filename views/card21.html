<!doctype html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>人物誌 — 一屏</title>
    <link rel="stylesheet" href="/css/card-studio-nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100dvh; overflow: auto; display: flex; flex-direction: column;
            background: #f6f3eb; color: #243e34;
            font: 12px/1.3 "Noto Serif TC", serif;
        }
        .folio {
            flex: 1; min-height: 0; width: min(1080px, 100%); margin: 0 auto;
            padding: 8px 18px 10px; display: grid;
            grid-template-rows: auto auto auto auto;
            gap: 8px;
        }
        .mast {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #243e34; padding-bottom: 5px;
            font: 9px/1 "Space Grotesk", sans-serif; letter-spacing: 0.14em;
        }
        .stage { min-height: 0; display: grid; grid-template-columns: 1.05fr 0.72fr 0.85fr; gap: 16px; }
        .kicker { display: flex; align-items: center; gap: 8px; font: 9px/1 "Space Grotesk", sans-serif; letter-spacing: 0.12em; color: #7f8878; }
        .kicker i { width: 5px; height: 5px; border-radius: 50%; background: #8c4b36; }
        h1 { margin: 6px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.15; }
        .latin { margin: 2px 0 0; font: italic 13px/1 "Cormorant Garamond", serif; letter-spacing: 0.18em; }
        .role { margin: 8px 0 0; color: #7f8878; letter-spacing: 0.06em; }
        .rule { width: 28px; height: 1px; background: #8c4b36; margin: 8px 0; }
        .quote { margin: 0; color: #697666; font-size: 13px; }
        figure { margin: 0; min-height: 0; display: flex; flex-direction: column; }
        .mat {
            flex: 1; min-height: 0; background: #bbc5b3; border-radius: 46% 46% 0 0; overflow: hidden;
        }
        img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: saturate(0.7); }
        figcaption { display: flex; justify-content: space-between; margin-top: 4px; font: 8px/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; color: #7f8878; }
        .vitals { border-left: 1px solid #d4d6c9; padding-left: 14px; min-height: 0; display: flex; flex-direction: column; }
        .vitals h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
        .vitals h2 span { display: block; margin-top: 2px; font: 8px/1 "Space Grotesk", sans-serif; letter-spacing: 0.12em; color: #7f8878; }
        .bars { display: grid; gap: 6px; }
        .bar b { font: 9px/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; }
        .nums { float: right; font: 22px/1 "Cormorant Garamond", serif; }
        .track { height: 3px; background: #e4e6da; margin-top: 3px; }
        .track i { display: block; height: 100%; background: #577f60; }
        .bar:nth-child(2) .track i { background: #b4935f; }
        .bar:nth-child(3) .track i { background: #8c4b36; }
        .facts { margin: 8px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
        .facts div { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #d4d6c9; padding: 3px 0; }
        .facts b { font-weight: 500; color: #7f8878; font-size: 11px; }
        .facts span { font: 16px/1 "Cormorant Garamond", serif; }
        .band { border-top: 1px solid #d4d6c9; border-bottom: 1px solid #d4d6c9; padding: 4px 0; display: flex; align-items: baseline; gap: 10px; }
        .band span { font: 28px/0.8 "Cormorant Garamond", serif; color: #a3ad96; }
        .band p { margin: 0; font-size: 14px; }
        .split { min-height: 0; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; }
        .sub { display: flex; justify-content: space-between; border-bottom: 1px solid #243e34; padding-bottom: 3px; margin-bottom: 2px; font-size: 12px; }
        .sub span { font: 8px/1.4 "Space Grotesk", sans-serif; letter-spacing: 0.12em; color: #7f8878; }
        .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px solid #e6e4d8; }
        .row b { font-weight: 600; }
        .note .row span { color: #697666; }
        @media (max-width: 760px) {
            body { overflow: auto; height: auto; }
            .folio { grid-template-rows: auto auto auto auto; }
            .stage, .split, .facts { grid-template-columns: 1fr; }
            .mat { height: 180px; }
            .vitals { border-left: 0; padding-left: 0; border-top: 1px solid #d4d6c9; padding-top: 8px; }
        }
    </style>
</head>
<body>
    <nav class="studio-nav" data-studio-nav></nav>
    <article class="folio">
        <header class="mast"><span>THE CHARACTER ISSUE</span><span>VOL. 21</span></header>
        <div class="stage">
            <section>
                <p class="kicker"><i></i> CoC · INVESTIGATOR</p>
                <h1 data-studio="name"></h1>
                <p class="latin">LAM CHIU YE</p>
                <p class="role"><span data-studio="role"></span> · <span data-studio="trait"></span></p>
                <div class="rule"></div>
                <p class="quote">所有巧合，都有尚未被發現的原因。</p>
            </section>
            <figure>
                <div class="mat"><img data-studio="image" alt=""></div>
                <figcaption><span>01 / PORTRAIT</span><span>調查員</span></figcaption>
            </figure>
            <aside class="vitals">
                <h2>此刻的狀態<span>AT A GLANCE</span></h2>
                <div class="bars" data-studio-list="stats">
                    <template>
                        <div class="bar"><b data-field="name"></b><span class="nums" data-field="a"></span><div class="track"><i data-field="bar"></i></div></div>
                    </template>
                </div>
            </aside>
        </div>
        <div class="band"><span>“</span><p>森林記得每一個離開的人。</p></div>
        <div class="split">
            <section>
                <div class="sub">慣用行動<span>ACTIONS</span></div>
                <div data-studio-list="rolls"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div>
            </section>
            <section class="note">
                <div class="sub">旅途紀事<span>NOTES</span></div>
                <div data-studio-list="notes"><template><div class="row"><b data-field="name"></b><span data-field="value"></span></div></template></div>
            </section>
        </div>
    </article>
    <script src="/common/card-studio.js"></script>
</body>
</html>
