# Example multi-gateway + shared Primary Roll Worker.
# Secrets live in .env* files (never commit real tokens).
#
# Recommended topology when you run Discord AND TG/LINE/WA as separate containers:
#   roll-primary  ← one shared HTTP dice process
#   discord-bot / non-discord-bot  ← Gateways with ROLL_WORKER_SPAWN=false
#
# CRITICAL: .wl / .token / export write files under /app/temp and /app/export on the
# Worker. Gateways must mount the SAME volumes, or Discord will log
# "fileLink/sendImage artifact missing".
#
# See docs/DOCKER_SETUP.md for upgrade / permissions notes.

services:
  mongodb:
    image: mongo:8.2
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27069:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: hktrpgRollBot
      MONGO_INITDB_ROOT_USERNAME: hktrpgadmin
      MONGO_INITDB_ROOT_PASSWORD: change-this-password
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Shared Primary — keep :3950 on the compose network only (no public ports).
  roll-primary:
    build:
      context: ..
      dockerfile: docker/Dockerfile.non-discord
    container_name: roll-primary
    restart: unless-stopped
    user: node
    command: ["node", "roll-worker.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env.roll-primary
    environment:
      TZ: Asia/Taipei
      ROLL_WORKER_MODE: "true"
      ROLL_WORKER_HOST: "0.0.0.0"
      ROLL_WORKER_PORT: "3950"
      ROLL_WORKER_SPAWN: "false"
      # Same root on all services that read Worker-written files:
      ROLL_ARTIFACT_ROOT: "/app"
    volumes:
      - roll-primary-log:/app/log
      - roll-primary-modules-log:/app/modules/log
      # Shared with Gateways (wheel GIF, token PNG, story export, …)
      - shared-temp:/app/temp
      - shared-export:/app/export

  discord-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.discord
    container_name: discord-bot
    restart: unless-stopped
    user: node
    depends_on:
      mongodb:
        condition: service_healthy
      roll-primary:
        condition: service_started
    env_file:
      - .env.discord
    environment:
      TZ: Asia/Taipei
      ROLL_WORKER_URL: http://roll-primary:3950
      ROLL_WORKER_SPAWN: "false"
      ROLL_ARTIFACT_ROOT: "/app"
    volumes:
      - discord-log:/app/log
      - discord-modules-log:/app/modules/log
      - shared-temp:/app/temp
      - shared-export:/app/export

  non-discord-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.non-discord
    container_name: non-discord-bot
    restart: unless-stopped
    user: node
    depends_on:
      mongodb:
        condition: service_healthy
      roll-primary:
        condition: service_started
    env_file:
      - .env.non-discord
    environment:
      TZ: Asia/Taipei
      ROLL_WORKER_URL: http://roll-primary:3950
      ROLL_WORKER_SPAWN: "false"
      ROLL_ARTIFACT_ROOT: "/app"
    volumes:
      - non-discord-log:/app/log
      - non-discord-modules-log:/app/modules/log
      - shared-temp:/app/temp
      - shared-export:/app/export
      - whatsapp-session:/app/.wwebjs_auth

volumes:
  mongodb-data:
  mongodb-config:
  shared-temp:
  shared-export:
  roll-primary-log:
  roll-primary-modules-log:
  discord-log:
  discord-modules-log:
  non-discord-log:
  non-discord-modules-log:
  whatsapp-session:
