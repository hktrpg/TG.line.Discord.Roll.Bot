version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-patches:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope" 