<body class="bg-color t-live-page" id="body">
    <header>
        <div id="header"></div>
    </header>
    <main id="atelier-root"><p class="a-loading">正在讀取角色卡…</p></main>
    <dialog id="atelier-dialog" aria-labelledby="atelier-dialog-title"></dialog>
    <div id="atelier-toast" role="status" aria-live="polite" hidden></div>
    <details id="cardt-management"><summary>完整角色管理 · 編輯、分類、匯入／匯出及頻道設定</summary>
    
    <div class="container-fluid px-3 px-md-4 py-3">
        <!-- Success Alert -->
        <div class="alert alert-success alert-dismissible fade show overlay" 
             style="position: fixed; z-index: 999; display: none;" 
             role="alert" id="warning-update">
            <i class="fas fa-check-circle me-2"></i>
            <span data-www-i18n-html="alert_update_success_html"><strong>更新成功!</strong> 你可以在聊天平台上使用新資料了。</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Error Alert -->
        <div class="alert alert-danger alert-dismissible fade show overlay" 
             style="position: fixed; z-index: 999; display: none;" 
             role="alert" id="warning-updateError">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span data-www-i18n-html="alert_update_failed_html"><strong>更新失敗!</strong> 請檢查或向HKTRPG回報。</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Vue App Container -->
        <div id="array-rendering" class="container-fluid px-3 px-md-4 py-3">
            <!-- Hybrid UI Template will be loaded here -->
        </div>
    </div>
    
    </details>
    <footer>
        <div id="footer"></div>
    </footer>

    <!-- Common Modals -->
    <div id="commonModals"></div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
        integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous">
    </script>

    <!-- Common JavaScript Modules -->
    <script src="/common/www-i18n.js"></script>
    <script src="/common/site-chrome.js"></script>
    <script src="/common/card-section-grouping.js"></script>
    <script src="/common/cardManager.js"></script>
    <script src="/common/authManager.js"></script>
    <script src="/common/uiManager.js"></script>
    <script src="/common/character-import.js"></script>
    <script src="/common/socketManager.js"></script>
    <script src="/common/pageConfigManager.js"></script>
    <script src="/common/characterCardCommon.js"></script>

    <script src="/common/cardt/live.js"></script>
    <!-- Page Specific JavaScript -->
    <script>
        // Configuration object for page-specific settings
        const PAGE_CONFIG = {
            isPublic: false,
            isLive: true,
            onCardReady: CardtLive.readyCard,
            title: "HKTRPG Character Card",
            bodyClass: "",
            containerClass: "container-fluid px-3 px-md-4 py-3",
            vueContainerClass: "container-fluid px-3 px-md-4 py-3"
        };

        // Load common modals
        $("#commonModals").load("/common/characterCardModals.html", function() {
            debugLog('Modals loaded', 'info');
            if (typeof wwwApplyDomI18n === 'function') wwwApplyDomI18n(document.getElementById('commonModals'));
            initializeVueApps(PAGE_CONFIG.isPublic, true);
        });

        // Hide alerts initially
        $('#warning-update').hide();
        $('#warning-updateError').hide();

        window.addEventListener('beforeunload', function (event) {
            const current = (typeof card !== 'undefined' && card)
                || (typeof cardManager !== 'undefined' && cardManager.getCard && cardManager.getCard());
            if (current && current.hasUnsavedChanges) {
                const message = typeof wwwT === 'function' ? wwwT('unsaved_changes_confirm') : '';
                event.preventDefault();
                event.returnValue = message;
                return message;
            }
        });

        // Public card specific socket listeners
        
        // Private card specific socket listeners
        socket.on('cardUpdated', function(data) {
            if (data && data.success) {
                $('#warning-update').show();
                setTimeout(() => $('#warning-update').hide(), 3000);
            } else {
                $('#warning-updateError').show();
                setTimeout(() => $('#warning-updateError').hide(), 3000);
            }
        });
        
    </script>
    <script src="/common/carda/themes-a.js"></script>
    <script src="/common/carda/themes-b.js"></script>
    <script src="/common/carda/model.js"></script>
    <script src="/common/carda/app.js"></script>
</body>
