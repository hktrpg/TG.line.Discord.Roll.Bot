<!doctype html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>戲單 — 角色卡試看</title>
    <link rel="stylesheet" href="/css/card-studio-nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,560&family=Outfit:wght@400;560&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #140e0c; color: #1c140f; font-family: Outfit, "PingFang TC", sans-serif; }
        .stage { display: grid; min-height: calc(100vh - 46px); grid-template-columns: minmax(280px, 42vw) 1fr; }
        .curtain {
            position: sticky;
            top: 46px;
            height: calc(100vh - 46px);
            background: #2a120e center/cover no-repeat;
            color: #f6efe4;
        }
        .curtain img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.8) contrast(1.05); }
        .curtain .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,8,6,0.1), rgba(20,8,6,0.82)); }
        .bill { position: absolute; left: 28px; right: 28px; bottom: 36px; }
        .kicker { margin: 0 0 8px; letter-spacing: 0.42em; font-size: 12px; text-transform: uppercase; }
        h1 { margin: 0; font-family: Fraunces, serif; font-weight: 560; font-size: clamp(64px, 8vw, 120px); line-height: 0.85; font-style: italic; }
        .role { margin: 14px 0 0; font-size: 18px; letter-spacing: 0.18em; }
        .script { background: #f3ead7; padding: 48px 8vw 80px; }
        h2 { margin: 36px 0 8px; font-family: Fraunces, serif; font-style: italic; font-weight: 500; font-size: 28px; }
        .cue { display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid rgba(28,20,15,0.18); }
        .cue b { font-weight: 560; letter-spacing: 0.08em; }
        .cue span { font-variant-numeric: tabular-nums; }
        ol { list-style: none; margin: 0; padding: 0; counter-reset: cue; }
        ol .cue { counter-increment: cue; }
        ol .cue::before { content: counter(cue, decimal-leading-zero); font-family: Fraunces, serif; font-style: italic; color: #8a3b24; }
        .aside { margin-top: 28px; max-width: 46ch; font-size: 18px; line-height: 1.55; }
        .aside strong { display: block; font-family: Fraunces, serif; font-style: italic; font-weight: 500; margin-bottom: 4px; }
        @media (max-width: 800px) {
            .stage { grid-template-columns: 1fr; }
            .curtain { min-height: 62vh; }
        }
    </style>
</head>
<body>
    <nav class="studio-nav" data-studio-nav></nav>
    <div class="stage">
        <aside class="curtain">
            <img data-studio="image" alt="">
            <div class="veil"></div>
            <div class="bill">
                <p class="kicker">Tonight</p>
                <h1 data-studio="name"></h1>
                <p class="role" data-studio="role"></p>
            </div>
        </aside>
        <article class="script">
            <h2>人物表</h2>
            <div data-studio-list="stats">
                <template>
                    <div class="cue"><b data-field="name"></b><span data-field="value"></span></div>
                </template>
            </div>
            <h2>場次</h2>
            <ol data-studio-list="rolls">
                <template>
                    <li class="cue"><b data-field="name"></b><span data-field="value"></span></li>
                </template>
            </ol>
            <div data-studio-list="notes">
                <template>
                    <p class="aside"><strong data-field="name"></strong><span data-field="value"></span></p>
                </template>
            </div>
        </article>
    </div>
    <script src="/common/card-studio.js"></script>
</body>
</html>
